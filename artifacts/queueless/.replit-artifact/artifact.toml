kind = "web"
previewPath = "/"
title = "QueueLess Pulse"
version = "1.0.0"
id = "artifacts/queueless"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21436

[services.development]
run = "pnpm --filter @workspace/queueless run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/queueless", "run", "build" ]
publicDir = "artifacts/queueless/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21436"
BASE_PATH = "/"
